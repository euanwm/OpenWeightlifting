basePath: /
definitions:
  structs.ChartData:
    properties:
      datasets:
        items:
          $ref: '#/definitions/structs.ChartSubData'
        type: array
      labels:
        items:
          type: string
        type: array
    type: object
  structs.ChartSubData:
    properties:
      data:
        items:
          type: number
        type: array
      label:
        type: string
    type: object
  structs.ContainerTime:
    properties:
      hour:
        type: integer
      min:
        type: integer
      sec:
        type: integer
    type: object
  structs.Entry:
    properties:
      best_cj:
        $ref: '#/definitions/structs.WeightKg'
      best_snatch:
        $ref: '#/definitions/structs.WeightKg'
      bodyweight:
        $ref: '#/definitions/structs.WeightKg'
      cj_1:
        $ref: '#/definitions/structs.WeightKg'
      cj_2:
        $ref: '#/definitions/structs.WeightKg'
      cj_3:
        $ref: '#/definitions/structs.WeightKg'
      country:
        type: string
      date:
        type: string
      event:
        type: string
      gender:
        type: string
      lifter_name:
        type: string
      sinclair:
        type: number
      snatch_1:
        $ref: '#/definitions/structs.WeightKg'
      snatch_2:
        $ref: '#/definitions/structs.WeightKg'
      snatch_3:
        $ref: '#/definitions/structs.WeightKg'
      total:
        $ref: '#/definitions/structs.WeightKg'
    type: object
  structs.EventSearch:
    properties:
      enddate:
        type: string
      startdate:
        type: string
    type: object
  structs.EventsList:
    properties:
      events:
        items:
          $ref: '#/definitions/structs.SingleEventMetaData'
        type: array
    type: object
  structs.LeaderboardPayload:
    properties:
      enddate:
        type: string
      federation:
        type: string
      sortby:
        type: string
      start:
        type: integer
      startdate:
        type: string
      stop:
        type: integer
      weightclass:
        type: string
      year:
        type: string
    type: object
  structs.LeaderboardResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/structs.Entry'
        type: array
      size:
        type: integer
    type: object
  structs.LiftReport:
    properties:
      comments:
        type: string
      lift:
        $ref: '#/definitions/structs.Entry'
    type: object
  structs.LifterHistory:
    properties:
      graph:
        $ref: '#/definitions/structs.ChartData'
      lifts:
        items:
          $ref: '#/definitions/structs.Entry'
        type: array
      name:
        type: string
      stats:
        $ref: '#/definitions/structs.LifterStats'
    type: object
  structs.LifterStats:
    properties:
      best_cj:
        $ref: '#/definitions/structs.WeightKg'
      best_snatch:
        $ref: '#/definitions/structs.WeightKg'
      best_total:
        $ref: '#/definitions/structs.WeightKg'
      make_rate_cj:
        items:
          type: integer
        type: array
      make_rate_snatches:
        items:
          type: integer
        type: array
    type: object
  structs.NameSearch:
    properties:
      federation:
        type: string
      name:
        type: string
    type: object
  structs.NameSearchResults:
    properties:
      names:
        description: 'todo: refactor this so we don''t have to worry about case sensitivity
          on the items within the slice'
        items:
          $ref: '#/definitions/structs.NameSearch'
        type: array
      total:
        type: integer
    type: object
  structs.NameSimilarity:
    properties:
      federation:
        type: string
      name:
        type: string
      score:
        type: number
    type: object
  structs.NameSimilarityResults:
    properties:
      names:
        items:
          $ref: '#/definitions/structs.NameSimilarity'
        type: array
      total:
        type: integer
    type: object
  structs.RivalsCombined:
    properties:
      combinedrivals:
        $ref: '#/definitions/structs.RivalsResult'
      federationrivals:
        $ref: '#/definitions/structs.RivalsResult'
    type: object
  structs.RivalsResult:
    properties:
      rivals:
        items:
          properties:
            federation:
              type: string
            gender:
              type: string
            name:
              type: string
            position:
              type: integer
            total:
              $ref: '#/definitions/structs.WeightKg'
          type: object
        type: array
      total:
        type: integer
    type: object
  structs.SearchLeaderboardRequest:
    properties:
      active_query:
        $ref: '#/definitions/structs.LeaderboardPayload'
      lifter_data:
        $ref: '#/definitions/structs.NameSearch'
    type: object
  structs.SearchLeaderboardResult:
    properties:
      lifter_data:
        $ref: '#/definitions/structs.NameSearch'
      position:
        type: integer
      query:
        $ref: '#/definitions/structs.LeaderboardPayload'
    type: object
  structs.SingleEventMetaData:
    properties:
      date:
        type: string
      federation:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  structs.WeightKg:
    type: object
host: api.openweightlifting.org
info:
  contact:
    email: euan@openweightlifting.org
    name: Euan Meston
  description: This is the API for OpenWeightlifting.org
  title: OpenWeightlifting API
  version: "1.0"
paths:
  /events:
    get:
      consumes:
      - application/json
      description: Fetch a single event, either by federation and event ID, or by
        federation and event name. When looking up by name, an optional date can be
        supplied to filter multi-day events loaded under a single event name.
      parameters:
      - description: Federation of the event
        in: query
        name: fed
        required: true
        type: string
      - description: ID of the event, required if name is not provided
        in: query
        name: id
        type: string
      - description: Name of the event, required if id is not provided
        in: query
        name: name
        type: string
      - description: Date to filter results by, only applicable when looking up by
          name
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.LeaderboardResponse'
        "204":
          description: No Content
      summary: Fetch a single event
      tags:
      - GET Requests
  /events/list:
    post:
      consumes:
      - application/json
      description: Metadata shows the name, federation and date of the event along
        with the filename in the event_data folder.
      parameters:
      - description: Date range to filter events by
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/structs.EventSearch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.EventsList'
        "400":
          description: Bad Request
      summary: Fetch available event metadata within a set date range
      tags:
      - POST Requests
  /graph:
    get:
      consumes:
      - application/json
      description: This is used within the lifter page to display a lifter's record.
        It returns a JSON object that can be used with ChartJS without having to do
        any additional processing.
      parameters:
      - description: Name of the lifter, must be an exact match
        in: query
        name: name
        required: true
        type: string
      - description: Federation to filter lifts by
        in: query
        name: federation
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.ChartData'
        "204":
          description: No Content
      summary: Retrieve a lifter's record for use with ChartJS on the leaderboard
        page
      tags:
      - GET Requests
  /history:
    get:
      consumes:
      - application/json
      description: Pull a lifter's history by name. The name must be an exact match
        and can be checked using the search endpoint.
      parameters:
      - description: Name of the lifter, must be an exact match
        in: query
        name: name
        required: true
        type: string
      - description: Federation to filter lifts by
        in: query
        name: federation
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.LifterHistory'
        "204":
          description: No Content
      summary: Retrieve a lifter's history
      tags:
      - GET Requests
  /issue:
    post:
      consumes:
      - application/json
      description: Report an issue with a lift to the discord server
      parameters:
      - description: Lift to report, along with comments describing the issue
        in: body
        name: report
        required: true
        schema:
          $ref: '#/definitions/structs.LiftReport'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
      summary: Report an issue with a lift
      tags:
      - POST Requests
  /leaderboard:
    get:
      consumes:
      - application/json
      description: This is the used on the index page of the website and pulls the
        highest single lift for a lifter within the selected filter.
      parameters:
      - default: 0
        description: Position to begin from within the full query
        in: query
        name: start
        type: integer
      - default: 50
        description: Position to stop at within the full query
        in: query
        name: stop
        type: integer
      - default: total
        description: Sort by either total or sinclair
        in: query
        name: sortBy
        type: string
      - description: Federation or country to filter by
        in: query
        name: federation
        type: string
      - default: MALL
        description: Weightclass to filter by
        in: query
        name: weightclass
        type: string
      - description: Year to filter by, mutually exclusive with startdate/enddate
        in: query
        name: year
        type: integer
      - description: Start date to filter from, mutually exclusive with year
        in: query
        name: startdate
        type: string
      - description: End date to filter to, mutually exclusive with year
        in: query
        name: enddate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.LeaderboardResponse'
        "400":
          description: Bad Request
      summary: Main table on the index page
      tags:
      - GET Requests
  /leaderboard/search:
    post:
      consumes:
      - application/json
      description: Checks whether a lifter appears within the results of a given leaderboard
        query and returns their position.
      parameters:
      - description: Lifter to search for and the leaderboard query to search within
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/structs.SearchLeaderboardRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.SearchLeaderboardResult'
        "400":
          description: Bad Request
      summary: Find a lifter's position within the leaderboard
      tags:
      - POST Requests
  /rivals:
    get:
      consumes:
      - application/json
      description: Returns the lifters ranked immediately around the given lifter,
        both within their federation (or country) and across all federations combined,
        for the current competition year.
      parameters:
      - description: Name of the lifter, must be an exact match
        in: query
        name: name
        required: true
        type: string
      - description: Gender to filter by
        in: query
        name: sex
        required: true
        type: string
      - description: Federation or country to filter by, defaults to all federations
        in: query
        name: fed
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.RivalsCombined'
      summary: Find a lifter's closest rivals by total
      tags:
      - GET Requests
  /search:
    get:
      consumes:
      - application/json
      description: Looks up a lifter by name and returns a list of possible matches.
        Requires a minimum of 3 characters.
      parameters:
      - description: Name to search for, minimum 3 characters
        in: query
        name: name
        required: true
        type: string
      - default: 50
        description: Limit the number of results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.NameSearchResults'
        "204":
          description: No Content
      summary: Search through lifter names
      tags:
      - GET Requests
  /search/similarity:
    get:
      consumes:
      - application/json
      description: Returns lifter names that are phonetically or typographically similar
        to the query. Handles IWF "LASTNAME Firstname" format automatically.
      parameters:
      - description: Name to search for
        in: query
        name: name
        required: true
        type: string
      - description: Federation the lifter competes in
        in: query
        name: federation
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.NameSimilarityResults'
        "204":
          description: No Content
      summary: Fuzzy search for similar lifter names
      tags:
      - GET Requests
  /time:
    get:
      description: Returns the current server time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.ContainerTime'
      summary: Checking the servers localtime
      tags:
      - Utilities and Testing
schemes:
- https
swagger: "2.0"
